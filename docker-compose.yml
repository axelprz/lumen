#
# Interactive development shell with the .NET 10 SDK and the repo mounted at /src:
#
#   docker compose run --rm dev                    # bash inside the container
#   docker compose run --rm dev dotnet test        # one-off command
#
# Build output goes to a named volume (see LUMEN_ARTIFACTS_PATH in Directory.Build.props), so Linux
# builds in the container never mix with bin/obj from a Windows build on the host.

services:
  dev:
    build:
      context: .
      target: base
    image: lumen-dev:local
    working_dir: /src
    environment:
      LUMEN_ARTIFACTS_PATH: /artifacts
    volumes:
      - .:/src
      - lumen-artifacts:/artifacts
      - lumen-nuget:/root/.nuget/packages
    stdin_open: true
    tty: true
    command: bash

volumes:
  lumen-artifacts:
  lumen-nuget:
